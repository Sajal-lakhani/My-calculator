<!DOCTYPE html>
<html>
<head>
<title>Calculator App</title>
<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f0f0f0;
    font-family: Arial;
}
.calculator {
    background: #1f2937;
    padding: 20px;
    border-radius: 20px;
    width: 280px;
}
#display {
    background: #1f2937;
    color: white;
    font-size: 40px;
    text-align: right;
    padding: 20px 10px;
    min-height: 50px;
    word-wrap: break-word;
}
.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}
button {
    padding: 18px;
    font-size: 22px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    color: white;
    font-weight: bold;
}
.orange { background: #ff9f0a; }
.gray { background: #4a5a73; }
button:active { opacity: 0.7; }
</style>
</head>
<body>

<div class="calculator">
    <div id="display">0</div>
    <div class="buttons">
        <button class="orange" onclick="appendValue('+')">+</button>
        <button class="gray" onclick="appendValue('7')">7</button>
        <button class="gray" onclick="appendValue('8')">8</button>
        <button class="gray" onclick="appendValue('9')">9</button>

        <button class="orange" onclick="appendValue('-')">-</button>
        <button class="gray" onclick="appendValue('4')">4</button>
        <button class="gray" onclick="appendValue('5')">5</button>
        <button class="gray" onclick="appendValue('6')">6</button>

        <button class="orange" onclick="appendValue('*')">*</button>
        <button class="gray" onclick="appendValue('1')">1</button>
        <button class="gray" onclick="appendValue('2')">2</button>
        <button class="gray" onclick="appendValue('3')">3</button>

        <button class="orange" onclick="appendValue('/')">/</button>
        <button class="gray" onclick="appendValue('0')">0</button>
        <button class="gray" onclick="appendValue('.')">.</button>
        <button class="gray" onclick="calculate()">=</button>

        <button class="orange" onclick="clearDisplay()">C</button>
    </div>
</div>

<script>
let display = document.getElementById("display");
let currentValue = "";

function appendValue(val) {
    if(currentValue === "0") currentValue = "";
    currentValue += val;
    display.textContent = currentValue;
}

function clearDisplay() {
    currentValue = "";
    display.textContent = "0";
}

function calculate() {
    try {
        currentValue = eval(currentValue).toString();
        display.textContent = currentValue;
    } catch {
        display.textContent = "Error";
        currentValue = "";
    }
}
</script>

</body>
</html>
